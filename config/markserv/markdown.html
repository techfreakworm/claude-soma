<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<title>{{title}}</title>
	<meta charset="utf-8">
	<link rel="stylesheet" href="{markserv}templates/markserv.css">
	<link rel="stylesheet" href="{markserv}templates/highlight-js-github-gist.css">
	<script type="text/javascript" id="MathJax-script" async
	      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
        </script>
	<style>
	#soma-dl-btn {
		position: fixed;
		top: 12px;
		right: 12px;
		z-index: 9999;
		display: inline-block;
		padding: 5px 10px;
		background: #f6f8fa;
		color: #24292f;
		border: 1px solid #d0d7de;
		border-radius: 6px;
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
		font-size: 12px;
		font-weight: 500;
		line-height: 20px;
		text-decoration: none;
		cursor: pointer;
		white-space: nowrap;
		box-shadow: 0 1px 2px rgba(31, 35, 40, 0.1);
		transition: background 0.1s ease;
	}
	#soma-dl-btn:hover {
		background: #eaeef2;
		border-color: #a8b1ba;
		text-decoration: none;
	}
	@media print {
		#soma-dl-btn {
			display: none;
		}
	}
	</style>
</head>
<body>
<a id="soma-dl-btn" href="#">&#8659; Download .md</a>
<script>
document.addEventListener('DOMContentLoaded', function() {
	var btn = document.getElementById('soma-dl-btn');
	if (!btn) {
		return;
	}
	var pathname = window.location.pathname;
	btn.href = pathname + '?dl=1';
	var parts = pathname.split('/');
	var filename = decodeURIComponent(parts[parts.length - 1] || 'document.md');
	btn.setAttribute('download', filename);
});
</script>
<article class="markdown-body">
{{{content}}}
<footer><sup><hr> Served by <a href="https://www.npmjs.com/package/markserv">MarkServ</a> | PID: {{pid}}</sup></footer>
</article>
</body>
</html>
