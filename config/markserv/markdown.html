<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="color-scheme" content="light dark">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<title>{{title}}</title>
	<meta charset="utf-8">
	<link rel="stylesheet" href="{markserv}templates/markserv.css">
	<link rel="stylesheet" href="{markserv}templates/highlight-js-github-gist.css">
	<script type="text/javascript" id="MathJax-script" async
	      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
        </script>
	<style>
	#soma-dl-btn {
		position: fixed;
		top: 12px;
		right: 12px;
		z-index: 9999;
		display: inline-block;
		padding: 5px 10px;
		background: #f6f8fa;
		color: #24292f;
		border: 1px solid #d0d7de;
		border-radius: 6px;
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
		font-size: 12px;
		font-weight: 500;
		line-height: 20px;
		text-decoration: none;
		cursor: pointer;
		white-space: nowrap;
		box-shadow: 0 1px 2px rgba(31, 35, 40, 0.1);
		transition: background 0.1s ease;
	}
	#soma-dl-btn:hover {
		background: #eaeef2;
		border-color: #a8b1ba;
		text-decoration: none;
	}
	@media print {
		#soma-dl-btn {
			display: none;
		}
	}
	/* ---------------------------------------------------------------------
	   Auto dark mode. Triggers only when the viewer's device is in dark
	   mode; light mode is untouched. This inline block is loaded AFTER the
	   linked markserv.css + highlight-js-github-gist.css, so equal- (or
	   higher-) specificity selectors here win the cascade by source order.
	   The base theme paints the page white via `outline: 1300px solid #fff`
	   on <body> (there is no explicit background), so we recolor the outline
	   as well as html/body backgrounds.
	   --------------------------------------------------------------------- */
	@media (prefers-color-scheme: dark) {
		html { background: #0d1117; }
		body {
			background: #0d1117;
			outline-color: #0d1117;
			border-color: #30363d;
		}
		body .markdown-body {
			color: #c9d1d9;
			background: #0d1117;
		}
		.markdown-body a { color: #58a6ff; }
		.markdown-body h1,
		.markdown-body h2 { border-bottom-color: #21262d; }
		.markdown-body h6 { color: #8b949e; }
		.markdown-body hr { background-color: #30363d; }
		.markdown-body blockquote {
			color: #8b949e;
			border-left-color: #30363d;
		}
		.markdown-body table th,
		.markdown-body table td { border-color: #30363d; }
		.markdown-body table tr {
			background-color: #0d1117;
			border-top-color: #21262d;
		}
		.markdown-body table tr:nth-child(2n) { background-color: #161b22; }
		.markdown-body code {
			background-color: rgba(110, 118, 129, 0.4);
			color: #c9d1d9;
		}
		.markdown-body pre,
		.markdown-body .highlight pre {
			background-color: #161b22;
			color: #c9d1d9;
		}
		.markdown-body kbd {
			background-color: #161b22;
			border-color: #30363d;
			color: #c9d1d9;
		}

		/* Download button — dark variant */
		#soma-dl-btn {
			background: #21262d;
			color: #c9d1d9;
			border-color: #30363d;
			box-shadow: 0 1px 2px rgba(1, 4, 9, 0.4);
		}
		#soma-dl-btn:hover {
			background: #30363d;
			border-color: #8b949e;
		}

		/* highlight.js — github-dark syntax palette (overrides the light gist
		   theme loaded above). .hljs background is transparent so the <pre>
		   #161b22 shows through and the block reads as one surface. */
		.hljs { color: #c9d1d9; background: transparent; }
		.hljs-doctag, .hljs-keyword, .hljs-meta .hljs-keyword,
		.hljs-template-tag, .hljs-template-variable, .hljs-type,
		.hljs-variable.language_ { color: #ff7b72; }
		.hljs-title, .hljs-title.class_, .hljs-title.class_.inherited__,
		.hljs-title.function_ { color: #d2a8ff; }
		.hljs-attr, .hljs-attribute, .hljs-literal, .hljs-meta,
		.hljs-number, .hljs-operator, .hljs-variable, .hljs-selector-attr,
		.hljs-selector-class, .hljs-selector-id { color: #79c0ff; }
		.hljs-regexp, .hljs-string, .hljs-meta .hljs-string { color: #a5d6ff; }
		.hljs-built_in, .hljs-symbol { color: #ffa657; }
		.hljs-comment, .hljs-code, .hljs-formula { color: #8b949e; }
		.hljs-name, .hljs-quote, .hljs-selector-tag,
		.hljs-selector-pseudo { color: #7ee787; }
		.hljs-subst { color: #c9d1d9; }
		.hljs-section { color: #1f6feb; font-weight: bold; }
		.hljs-bullet { color: #f2cc60; }
		.hljs-emphasis { color: #c9d1d9; font-style: italic; }
		.hljs-strong { color: #c9d1d9; font-weight: bold; }
		.hljs-addition { color: #aff5b4; background-color: #033a16; }
		.hljs-deletion { color: #ffdcd7; background-color: #67060c; }
	}
	</style>
</head>
<body>
<a id="soma-dl-btn" href="#">&#8659; Download .md</a>
<script>
document.addEventListener('DOMContentLoaded', function() {
	var btn = document.getElementById('soma-dl-btn');
	if (!btn) {
		return;
	}
	var pathname = window.location.pathname;
	btn.href = pathname + '?dl=1';
	var parts = pathname.split('/');
	var filename = decodeURIComponent(parts[parts.length - 1] || 'document.md');
	btn.setAttribute('download', filename);
});
</script>
<article class="markdown-body">
{{{content}}}
<footer><sup><hr> Served by <a href="https://www.npmjs.com/package/markserv">MarkServ</a> | PID: {{pid}}</sup></footer>
</article>
</body>
</html>
