# Minimal tmux config: tmux-resurrect for MANUAL save/restore of operator windows.
# Deliberately does NOT auto-restore (continuum-restore is off) so it never fights the
# systemd-managed `hermes` session. See docs/tmux-session-persistence.md for rationale.
#
# Install TPM first:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Then copy this file to ~/.tmux.conf and press `prefix + I` to fetch the plugins.

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# When saving, also capture the command line of claude processes so a manual restore
# can re-launch them (note: this re-runs the command fresh; it does NOT restore the
# claude conversation - see the doc).
set -g @resurrect-processes 'claude'

# IMPORTANT: auto-restore is OFF on purpose. The channel session `hermes` is created and
# destroyed by claude-soma-channel.service; auto-restoring it would duplicate the session
# and can trigger the Telegram poller-hijack (docs/KNOWN_BUGS.md #1). Manual only:
#   prefix + Ctrl-s   save
#   prefix + Ctrl-r   restore
set -g @continuum-restore 'off'

run '~/.tmux/plugins/tpm/tpm'
